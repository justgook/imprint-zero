<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">MP001 Fabricator concept placeholder</title>
  <desc id="desc">Production direction for a small hovering Helix assembly drone with a short-range arc cutter.</desc>
  <rect width="960" height="540" fill="#11131a"/>
  <rect x="40" y="40" width="880" height="460" rx="20" fill="#1d2130" stroke="#8e20ff" stroke-width="4"/>
