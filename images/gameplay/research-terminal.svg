<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Research Terminal interface placeholder</title><desc id="desc">A three-panel layout for Machine Profiles, a central Mesh Dive board, and discovered Blueprint progress without hidden-output totals.</desc><rect width="1280" height="720" fill="#10131a"/><rect x="40" y="40" width="1200" height="640" rx="18" fill="#1a2030" stroke="#8e20ff" stroke-width="4"/><text x="70" y="88" fill="#fff" font-family="monospace" font-size="28" font-weight="bold">RESEARCH TERMINAL · REPLACE WITH FINAL UI</text><rect x="70" y="120" width="270" height="500" rx="10" fill="#121723" stroke="#596174" stroke-width="3"/><text x="95" y="160" fill="#c4a8ff" font-family="monospace" font-size="21">MACHINE PROFILES</text><rect x="95" y="185" width="220" height="56" fill="#332354"/><rect x="95" y="255" width="220" height="56" fill="#242b3b"/><rect x="95" y="325" width="220" height="56" fill="#242b3b"/><text x="95" y="580" fill="#8f97a8" font-family="monospace" font-size="16">Known entries only</text><rect x="370" y="120" width="520" height="500" rx="10" fill="#121723" stroke="#596174" stroke-width="3"/><text x="395" y="160" fill="#c4a8ff" font-family="monospace" font-size="21">HUB MESH DIVE BOARD</text><path d="M430 470L520 390 610 430 690 300 800 240" fill="none" stroke="#c4a8ff" stroke-width="9"/><circle cx="430" cy="470" r="18" fill="#8e20ff"/><circle cx="520" cy="390" r="18" fill="#8e20ff"/><circle cx="610" cy="430" r="18" fill="#f1b84b"/><circle cx="690" cy="300" r="18" fill="#8e20ff"/><circle cx="800" cy="240" r="24" fill="#e9edf5"/><text x="410" y="565" fill="#8f97a8" font-family="monospace" font-size="16">Show exit + unidentified discovery nodes</text><rect x="920" y="120" width="290" height="500" rx="10" fill="#121723" stroke="#596174" stroke-width="3"/><text x="945" y="160" fill="#c4a8ff" font-family="monospace" font-size="21">KNOWN PROGRESS</text><text x="945" y="215" fill="#fff" font-family="monospace" font-size="19">Machine Blueprint</text><text x="945" y="247" fill="#f1b84b" font-family="monospace" font-size="22">2 / 3</text><text x="945" y="310" fill="#fff" font-family="monospace" font-size="19">Discovered output</text><text x="945" y="342" fill="#f1b84b" font-family="monospace" font-size="22">1 / 2</text><text x="945" y="580" fill="#8f97a8" font-family="monospace" font-size="16">Never show hidden totals</text></svg>