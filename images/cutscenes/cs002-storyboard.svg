<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"><rect width="1200" height="620" fill="#101923"/><g font-family="sans-serif"><text x="35" y="45" font-size="28" fill="#dbeafe">CS002 · RAM INTRODUCTION / RELAY RECOVERY LEAD</text><text x="35" y="80" font-size="17" fill="#fbbf24">STORYBOARD PLACEHOLDER — replace with reviewed comic compositions, limited motion and transitions.</text><rect x="35" y="130" width="350" height="320" rx="6" fill="#263340" stroke="#8499b1"/><text x="50" y="170" font-size="23" fill="#dbeafe">1 · QUIETER ARRIVAL</text><text x="50" y="210" font-size="17" fill="#dbeafe">After M03 extraction.</text><text x="50" y="245" font-size="17" fill="#dbeafe">RAM and deployed Character.</text><text x="50" y="280" font-size="17" fill="#dbeafe">HUB0 transition is a proposal.</text><text x="50" y="315" font-size="17" fill="#dbeafe">No extra Mission room.</text><text x="50" y="350" font-size="17" fill="#dbeafe">Keep rail-return continuity.</text><rect x="425" y="130" width="350" height="320" rx="6" fill="#263340" stroke="#8499b1"/><text x="440" y="170" font-size="23" fill="#dbeafe">2 · RAM INTRODUCTION</text><text x="440" y="210" font-size="17" fill="#dbeafe">Confident, practical presence.</text><text x="440" y="245" font-size="17" fill="#dbeafe">Short personal introduction.</text><text x="440" y="280" font-size="17" fill="#dbeafe">Humour, not low intelligence.</text><text x="440" y="315" font-size="17" fill="#dbeafe">Listener variant as needed.</text><text x="440" y="350" font-size="17" fill="#dbeafe">Exact speech still under review.</text><rect x="815" y="130" width="350" height="320" rx="6" fill="#263340" stroke="#8499b1"/><text x="830" y="170" font-size="23" fill="#dbeafe">3 · RELAY LEAD</text><text x="830" y="210" font-size="17" fill="#dbeafe">RELAY sealed herself inside.</text><text x="830" y="245" font-size="17" fill="#dbeafe">RAM can now recover her.</text><text x="830" y="280" font-size="17" fill="#dbeafe">Crew member, not a stranger.</text><text x="830" y="315" font-size="17" fill="#dbeafe">Do not name hidden Overdrive.</text><text x="830" y="350" font-size="17" fill="#dbeafe">End before M04 preparation.</text><text x="35" y="510" font-size="18" fill="#dbeafe">Replace with drawn comic compositions, reviewed speech, optional voice-over and panel/transition timing.</text><text x="35" y="549" font-size="18" fill="#dbeafe">Stable CS002 ID survives later Hub reorganization. Move the time allocation rather than counting it twice.</text><text x="35" y="588" font-size="17" fill="#dbeafe">No new origin claims, Machine Profile reveal or automatic M04 launch. Exact dialogue is not yet approved.</text></g></svg>
