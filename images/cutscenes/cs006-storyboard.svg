<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"><title>CS006 Hub briefing storyboard</title><rect width="1200" height="620" fill="#101923"/><g font-family="sans-serif"><text x="30" y="42" fill="#dbeafe" font-size="26">CS006 · RELAY FINDS A WAY IN</text><text x="30" y="78" fill="#fbbf24" font-size="16">STORYBOARD PLACEHOLDER — replace with drawn panels, limited motion and localized text.</text><rect x="30" y="120" width="265" height="330" rx="8" fill="#263340" stroke="#8499b1"/><text x="44" y="148" fill="#dbeafe" font-size="16">1 · FOUNDRY TRACE</text><text x="44" y="173" fill="#dbeafe" font-size="16">All four crew present.</text><text x="44" y="198" fill="#dbeafe" font-size="16">Four occupied Coffins.</text><text x="44" y="223" fill="#dbeafe" font-size="16">RELAY opens physical notes.</text><text x="44" y="248" fill="#dbeafe" font-size="16">Dormant Hub consoles.</text><text x="44" y="273" fill="#dbeafe" font-size="16">A local wired access trace.</text><rect x="320" y="120" width="265" height="330" rx="8" fill="#263340" stroke="#8499b1"/><text x="334" y="148" fill="#dbeafe" font-size="16">2 · COMPATIBLE PATTERNS</text><text x="334" y="173" fill="#dbeafe" font-size="16">Reachable records respond</text><text x="334" y="198" fill="#dbeafe" font-size="16">to each crew profile.</text><text x="334" y="223" fill="#dbeafe" font-size="16">Recognition is not origin.</text><text x="334" y="248" fill="#dbeafe" font-size="16">No transformation shown.</text><text x="334" y="273" fill="#dbeafe" font-size="16">No Overdrive / Imprint name.</text><rect x="610" y="120" width="265" height="330" rx="8" fill="#263340" stroke="#8499b1"/><text x="624" y="148" fill="#dbeafe" font-size="16">3 · CREW RESPONSE</text><text x="624" y="173" fill="#dbeafe" font-size="16">ROOK: practical questions.</text><text x="624" y="198" fill="#dbeafe" font-size="16">VECTOR: identity doubt.</text><text x="624" y="223" fill="#dbeafe" font-size="16">RAM: safe passage.</text><text x="624" y="248" fill="#dbeafe" font-size="16">RELAY: access, not certainty.</text><text x="624" y="273" fill="#dbeafe" font-size="16">Exact dialogue not authored.</text><rect x="900" y="120" width="265" height="330" rx="8" fill="#263340" stroke="#8499b1"/><text x="914" y="148" fill="#dbeafe" font-size="16">4 · GO TOGETHER</text><text x="914" y="173" fill="#dbeafe" font-size="16">Physical presence required.</text><text x="914" y="198" fill="#dbeafe" font-size="16">Separate personal Coffins.</text><text x="914" y="223" fill="#dbeafe" font-size="16">RELAY holds access links.</text><text x="914" y="248" fill="#dbeafe" font-size="16">Resume Hub preparation.</text><text x="914" y="273" fill="#dbeafe" font-size="16">No automatic M05 launch.</text><text x="30" y="505" fill="#dbeafe" font-size="17">Draw all four distinct Character likenesses; preserve RELAY's biological head and torso / prosthetic limbs.</text><text x="30" y="531" fill="#dbeafe" font-size="17">Do not show research UI, ability silhouettes, memory contents, origin proof or a fifth station.</text><text x="30" y="557" fill="#dbeafe" font-size="17">0:45 duration target · comic transitions / optional voice-over · exact text belongs to gettext.</text></g></svg>
