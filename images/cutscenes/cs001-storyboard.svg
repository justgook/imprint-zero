<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"><rect width="1200" height="620" fill="#101923"/><g font-family="sans-serif"><text x="35" y="45" font-size="28" fill="#dbeafe">CS001 · RAM BREACH / ANIMATED-COMIC HANDOFF</text><text x="35" y="80" font-size="17" fill="#fbbf24">STORYBOARD PLACEHOLDER — replace with reviewed comic compositions, limited motion and transitions.</text><rect x="35" y="130" width="350" height="320" rx="6" fill="#263340" stroke="#8499b1"/><text x="50" y="170" font-size="23" fill="#dbeafe">1 · WALL IMPACT</text><text x="50" y="210" font-size="17" fill="#dbeafe">Gameplay footsteps accelerate.</text><text x="50" y="245" font-size="17" fill="#dbeafe">Roar and wall rupture.</text><text x="50" y="280" font-size="17" fill="#dbeafe">Pause begins at impact.</text><text x="50" y="315" font-size="17" fill="#dbeafe">RAM enters from the right.</text><text x="50" y="350" font-size="17" fill="#dbeafe">Show heavy debris / silhouette.</text><rect x="425" y="130" width="350" height="320" rx="6" fill="#263340" stroke="#8499b1"/><text x="440" y="170" font-size="23" fill="#dbeafe">2 · RAM REVEAL</text><text x="440" y="210" font-size="17" fill="#dbeafe">Massive Impact silhouette.</text><text x="440" y="245" font-size="17" fill="#dbeafe">Station visibly destroyed.</text><text x="440" y="280" font-size="17" fill="#dbeafe">Approved joke from gettext.</text><text x="440" y="315" font-size="17" fill="#dbeafe">Bubble; optional voice-over.</text><text x="440" y="350" font-size="17" fill="#dbeafe">No Overdrive or automatic kill.</text><rect x="815" y="130" width="350" height="320" rx="6" fill="#263340" stroke="#8499b1"/><text x="830" y="170" font-size="23" fill="#dbeafe">3 · SAFETY DOOR</text><text x="830" y="210" font-size="17" fill="#dbeafe">Door opens; Switch recoils.</text><text x="830" y="245" font-size="17" fill="#dbeafe">ROOK / VECTOR variants.</text><text x="830" y="280" font-size="17" fill="#dbeafe">Player visible on arena side.</text><text x="830" y="315" font-size="17" fill="#dbeafe">Door shuts before resume.</text><text x="830" y="350" font-size="17" fill="#dbeafe">RAM remains behind interlock.</text><text x="35" y="510" font-size="18" fill="#dbeafe">Replace with drawn panels and sound/transition annotations; this sheet does not set final camera positions.</text><text x="35" y="549" font-size="18" fill="#dbeafe">Preserve watched/skipped handoff: broken station, isolated RAM, safely staged player, Boss fight resumes.</text><text x="35" y="588" font-size="17" fill="#dbeafe">Character variants share the same world result. Use scene-owned dialogue links, not generated speech lettering.</text></g></svg>
