<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-label="MA01 local gameplay viewport and proposed depth-layer ownership"><title>MA01 · local viewport and parallax ownership · composition handoff</title><defs><pattern id="banks" width="95" height="85" patternUnits="userSpaceOnUse"><rect x="8" y="8" width="74" height="66" fill="#34434c" stroke="#778b94"/><path d="M20 22H70M20 42H70M20 62H70" stroke="#82949a" opacity=".45"/></pattern><g id="bug" fill="none" stroke="#eb8d70" stroke-width="3"><ellipse cx="0" cy="0" rx="6" ry="3" fill="#a35549"/><path d="M-4-2L-10-6L-14 1M-4 1L-11 4L-13 8M4-2L10-6L14 1M4 1L11 4L13 8"/></g></defs><rect width="1600" height="980" fill="#111923"/><g font-family="sans-serif" fill="#e5e9ec"><text x="40" y="45" font-size="27">MA01 · camera-sized action slice, not the full height of the Basilica</text><text x="40" y="75" font-size="17" fill="#a5b5c3">Authored layer/contrast study · not a capture, collision map, measured jump solution or approved render pipeline</text><rect x="40" y="100" width="1040" height="520" fill="#18202a" stroke="#d2dbe1" stroke-width="3"/><g opacity=".26" fill="none" stroke="#8c9caa" stroke-width="14"><path d="M140 610V200Q235 70 330 200V610M475 610V200Q570 70 665 200V610M810 610V200Q905 70 1000 200V610"/></g><path d="M100 265H1020M100 335H1020" stroke="#697f8d" opacity=".23" stroke-width="10"/><g opacity=".5"><rect x="70" y="115" width="210" height="395" fill="url(#banks)"/><rect x="725" y="115" width="300" height="395" fill="url(#banks)"/></g><g fill="#3e5361" stroke="#b9c8d0" stroke-width="3"><rect x="75" y="510" width="970" height="38"/><rect x="80" y="350" width="170" height="17"/><rect x="850" y="390" width="195" height="17"/></g><g fill="#71848f" stroke="#d5dfe5" stroke-width="2"><circle cx="420" cy="382" r="14"/><path d="M410 398H433L441 454H406ZM409 452L394 508H407L427 456ZM429 453L452 508H465L444 451Z"/><path d="M426 405L464 423L468 415L437 396Z"/><rect x="459" y="411" width="55" height="8"/></g><g><use href="#bug" x="315" y="502"/><use href="#bug" x="365" y="502"/><use href="#bug" x="520" y="502"/><use href="#bug" x="575" y="502"/><use href="#bug" x="650" y="502"/><use href="#bug" x="790" y="502"/><use href="#bug" x="890" y="382"/><use href="#bug" x="170" y="342"/><use href="#bug" x="650" y="160" transform="rotate(180 650 160)"/></g><path d="M75 120H1045" stroke="#bfac7f" stroke-width="11"/><path d="M280 120Q460 170 680 120M700 120Q800 165 990 120" fill="none" stroke="#665b47" stroke-width="6"/><g fill="#05090f"><rect x="40" y="100" width="28" height="520"/><rect x="1050" y="100" width="30" height="520"/><path d="M40 580H170V620H40ZM970 590H1080V620H970Z"/></g><text x="105" y="585" font-size="16" fill="#d1dde5">ROOK / collision floor / tiny helpers = action plane</text><text x="1110" y="145" font-size="20">What moves with depth?</text><g font-size="17"><text x="1110" y="185" fill="#9eafbe">Far ribs, shafts, distant galleries</text><text x="1110" y="212">Slowest visual movement</text><text x="1110" y="255" fill="#9eafbe">Recessed archive banks / readers</text><text x="1110" y="282">Slower than action plane</text><text x="1110" y="325" fill="#d5dfe5">Floor, ledges, actors, entry mouths</text><text x="1110" y="352">Action-plane alignment</text><text x="1110" y="395" fill="#9eafbe">Nearest edge posts / cable rims</text><text x="1110" y="422">Stronger relative movement</text><text x="1110" y="465" fill="#e5b29d">Never conceal contact tells</text><text x="1110" y="492">or mislabel background as collision</text></g><g fill="#1d2b38" stroke="#657e91"><rect x="40" y="655" width="485" height="265" rx="8"/><rect x="557" y="655" width="486" height="265" rx="8"/><rect x="1075" y="655" width="485" height="265" rx="8"/></g><g font-size="18"><text x="65" y="690" font-size="23">Height is implied offscreen</text><text x="65" y="730">Crop columns, shelf stacks and ceiling ribs.</text><text x="65" y="765">Reveal distant levels through gaps/shafts.</text><text x="65" y="800">Do not zoom out to fit the whole vault.</text><text x="65" y="835">Upper scenery is not a required route.</text><text x="65" y="880" fill="#a5b5c3">Camera remains shared smooth side-follow.</text><text x="582" y="690" font-size="23">Swarm entries belong to the encounter</text><text x="582" y="730">Floor, walls, ceiling, gaps between shelves.</text><text x="582" y="765">Visible approach precedes damaging contact.</text><text x="582" y="800">Finite groups; stagger attack commitments.</text><text x="582" y="835">Reachable engagement for every kit.</text><text x="582" y="880" fill="#a5b5c3">Population / density / spacing are tuning targets.</text><text x="1100" y="690" font-size="23">Still to validate in motion</text><text x="1100" y="730">Occlusion, contrast, low-body attack hits.</text><text x="1100" y="765">RAM / RELAY versus ceiling arrivals.</text><text x="1100" y="800">Backtracking and safe control margins.</text><text x="1100" y="835">Parallax separation without false ledges.</text><text x="1100" y="880" fill="#a5b5c3">No numeric scroll factors are approved here.</text></g></g></svg>