none" stroke="#a8b3c4" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/><path d="M988 585 L1035 585" fill="none" stroke="#a8b3c4" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/><path d="M625 235 L670 218 L690 235" stroke="#d4b871" stroke-width="3" fill="none"/><text x="42" y="90" font-size="17">Main circulation stays ordinary-kit accessible; footprint boxes are not dimensions.</text><text x="42" y="535" font-size="16">Quiet source recovery after isolation</text><text x="42" y="565" font-size="16">Safe docks / service rooms / lower optional catch-return path</text><text x="42" y="595" font-size="16">No invisible hazards, timed civilian escort or compulsory Mesh Dive</text><text x="616" y="80" font-size="15">Damaged unpowered cable trail</text><text x="808" y="675" font-size="15">Low-jump RAM validation required; neither detour contains another exit.</text><text x="30" y="734" font-size="14" fill="#a8b3c4">Replace with measured blockout: test ordinary movement, spider recovery access, optional cycles and rail/control safety.</text></g></svg>
