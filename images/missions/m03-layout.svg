="18" fill="#dbeafe">Replace with traversable footprints, elevations, room boundaries, sightlines, reachable targets, and installed rails.</text><text x="35" y="697" font-size="18" fill="#dbeafe">Protect archive, rail control, docks and detours from pursuit/fire. Review backtracking before Coffin entry.</text><text x="35" y="734" font-size="18" fill="#dbeafe">Connectors show adjacency only. Review RAM breach camera, damage suspension, and two-Coffin departure.</text></g></svg>
