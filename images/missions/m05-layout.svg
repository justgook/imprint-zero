<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="990" viewBox="0 0 1200 990"><title>M05 expanded physical staging</title><rect width="1200" height="990" fill="#101923"/><g font-family="sans-serif"><text x="30" y="40" fill="#dbeafe" font-size="25">M05 · PAIRED ACCESS ALCOVES / PHYSICAL TRIAL LANES</text><text x="30" y="78" fill="#fbbf24" font-size="16">LAYOUT PLACEHOLDER — replace with scaled collision, receiver reach, gate machinery and Capsule routes.</text><rect x="30" y="120" width="310" height="130" rx="8" fill="#20384e" stroke="#8499b1"/><text x="44" y="148" fill="#dbeafe" font-size="16">R03 · RELAY safe access</text><text x="44" y="173" fill="#dbeafe" font-size="16">Wired interface / protected body</text><text x="44" y="198" fill="#dbeafe" font-size="16">No off-screen damage simulation</text><text x="44" y="223" fill="#dbeafe" font-size="16">Board input pauses world</text><path d="M340 185H390" stroke="#8499b1" stroke-width="3"/><rect x="390" y="120" width="770" height="130" rx="8" fill="#443039" stroke="#8499b1"/><text x="404" y="148" fill="#dbeafe" font-size="16">R04 · ROOK physical trial</text><text x="404" y="173" fill="#dbeafe" font-size="16">Safe crew staging → ordinary-kit opening → physical receiver</text><text x="404" y="198" fill="#dbeafe" font-size="16">CS007 at convergence → local Overdrive → validation → control RELAY</text><text x="404" y="223" fill="#dbeafe" font-size="16">Authored threat geometry and quantities remain to be designed</text><rect x="30" y="280" width="310" height="130" rx="8" fill="#20384e" stroke="#8499b1"/><text x="44" y="308" fill="#dbeafe" font-size="16">R05 · RELAY safe access</text><text x="44" y="333" fill="#dbeafe" font-size="16">Wired interface / protected body</text><text x="44" y="358" fill="#dbeafe" font-size="16">No off-screen damage simulation</text><text x="44" y="383" fill="#dbeafe" font-size="16">Board input pauses world</text><path d="M340 345H390" stroke="#8499b1" stroke-width="3"/><rect x="390" y="