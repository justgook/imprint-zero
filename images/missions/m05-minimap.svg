<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720"><title>M05 four-trial minimap</title><rect width="960" height="720" fill="#101923"/><g font-family="sans-serif"><text x="25" y="38" fill="#dbeafe" font-size="24">M05 · FOUR PHYSICAL TRIALS / RELAY JUNCTION</text><text x="25" y="75" fill="#fbbf24" font-size="15">MINIMAP PLACEHOLDER — replace with measured side-scrolling geography and safe branch returns.</text><g fill="none" stroke="#8499b1" stroke-width="4"><path d="M480 180V270M380 315H185V250M580 315H775V250M380 360H185V440M580 360H775V440M480 390V465M480 535V560"/></g><rect x="355" y="105" width="250" height="75" rx="8" fill="#20384e" stroke="#8499b1"/><text x="369" y="133" fill="#dbeafe" font-size="16">R01 · four-Coffin arrival</text><text x="369" y="158" fill="#dbeafe" font-size="16">Control RELAY</text><rect x="355" y="270" width="250" height="120" rx="8" fill="#534622" stroke="#8499b1"/><text x="369" y="298" fill="#dbeafe" font-size="16">R02 · trial junction</text><text x="369" y="323" fill="#dbeafe" font-size="16">Select any unfinished branch</text><text x="369" y="348" fill="#dbeafe" font-size="16">Core door: four validations</text><rect x="30" y="150" width="300" height="100" rx="8" fill="#443039" stroke="#8499b1"/><text x="44" y="178" fill="#dbeafe" font-size="16">R03 · RELAY's protected access</text><text x="44" y="203" fill="#dbeafe" font-size="16">R04 · ROOK's physical lane</text><text x="44" y="228" fill="#dbeafe" font-size="16">Receiver → CS007 → OD finish</text><rect x="630" y="150" width="300" height="100" rx="8" fill="#443039" stroke="#8499b1"/><text x="644" y="178" fill="#dbeafe" font-size="16">R05 · RELAY's protected access</text><text x="644" y="203" fill="#dbeafe" font-size="16">R06 · VECTOR's physical lane</text><text x="644" y="228" fill="#dbeafe" font-size="16">Receiver → CS008 → OD finish</text><rect x="30" y="440" width="300" height="100" rx="8" fill="#443039" stroke="#8499b1"/><text x="44" y="468" fill="#dbeafe" font-size="16">R07 · RELAY's protected access</text><text x="44" y="493" fill="#dbeafe" font-size="16">R08 · RAM's physical lane</text><text x="44" y="518" fill="#dbeafe" font-size="16">Receiver → CS009 → OD finish</text><rect x="630" y="440" width="300" height="100" rx="8" fill="#443039" stroke="#8499b1"/><text x="644" y="468" fill="#dbeafe" font-size="16">R09 · RELAY's own access</text><text x="644" y="493" fill="#dbeafe" font-size="16">CS010 → R10 physical lane</text><text x="644" y="518" fill="#dbeafe" font-size="16">No other Character handoff</text><rect x="355" y="465" width="250" height="70" rx="8" fill="#534622" stroke="#8499b1"/><text x="369" y="493" fill="#dbeafe" font-size="16">R11 · validation core</text><text x="369" y="518" fill="#dbeafe" font-size="16">All four profiles required</text><rect x="355" y="560" width="250" height="70" rx="8" fill="#264936" stroke="#8499b1"/><text x="369" y="588" fill="#dbeafe" font-size="16">R12 · four-Coffin return</text><text x="369" y="613" fill="#dbeafe" font-size="16">Same physical Hub → HUB1</text><text x="25" y="677" fill="#dbeafe" font-size="15">Working footprints only. Branches are mandatory, order-flexible, sequentially presented and safely separated.</text></g></svg>
