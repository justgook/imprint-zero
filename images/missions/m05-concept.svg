<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660"><title>M05 parallel-perspective gameplay presentation</title><rect width="1200" height="660" fill="#101923"/><g font-family="sans-serif"><text x="30" y="42" fill="#dbeafe" font-size="25">M05 · ONE INTERVAL / TWO PLAYABLE PERSPECTIVES</text><text x="30" y="80" fill="#fbbf24" font-size="16">GAMEPLAY PRESENTATION PLACEHOLDER — replace with gameplay-scale Dive, trial and convergence panels.</text><rect x="30" y="125" width="340" height="350" rx="8" fill="#20384e" stroke="#8499b1"/><text x="44" y="153" fill="#dbeafe" font-size="16">1 · RELAY / MESH DIVE</text><text x="44" y="178" fill="#dbeafe" font-size="16">Protected physical access body.</text><text x="44" y="203" fill="#dbeafe" font-size="16">Circuit-routing interface.</text><text x="44" y="228" fill="#dbeafe" font-size="16">Fixed budget / solvable board.</text><text x="44" y="253" fill="#dbeafe" font-size="16">Shared start click / shutter.</text><text x="44" y="278" fill="#dbeafe" font-size="16">Route ready is not activation.</text><text x="44" y="303" fill="#dbeafe" font-size="16">No fragments or Blueprint UI.</text><rect x="410" y="125" width="340" height="350" rx="8" fill="#443039" stroke="#8499b1"/><text x="424" y="153" fill="#dbeafe" font-size="16">2 · CREW / SAME INTERVAL</text><text x="424" y="178" fill="#dbeafe" font-size="16">Physical trial begins at link start.</text><text x="424" y="203" fill="#dbeafe" font-size="16">Replay shared start from this side.</text><text x="424" y="228" fill="#dbeafe" font-size="16">Ordinary default kit first.</text><text x="424" y="253" fill="#dbeafe" font-size="16">Reach receiver at endpoint cue.</text><text x="424" y="278" fill="#dbeafe" font-size="16">Not a playable historical memory.</text><text x="424" y="303" fill="#dbeafe" font-size="16">No free Character switching.</text><text x="424" y="328" fill="#dbeafe" font-size="16">RELAY branch omits this handoff.</text><rect x="790" y="125" width="340" height="350" rx="8" fill="#534622" stroke="#8499b1"/><text x="804" y="153" fill="#dbeafe" font-size="16">3 · CONVERGENCE</text><text x="804" y="178" fill="#dbeafe" font-size="16">Routed endpoint + receiver ready.</text><text x="804" y="203" fill="#dbeafe" font-size="16">Memory Cutscene pauses action.</text><text x="804" y="228" fill="#dbeafe" font-size="16">Recovered technique / uncertain origin.</text><text x="804" y="253" fill="#dbeafe" font-size="16">Local Overdrive enables finish.</text><text x="804" y="278" fill="#dbeafe" font-size="16">Profile validates only after finish.</text><text x="804" y="303" fill="#dbeafe" font-size="16">Return control to RELAY.</text><text x="804" y="328" fill="#dbeafe" font-size="16">Global unlock waits for core.</text><text x="30" y="535" fill="#dbeafe" font-size="17">Sequential player time; overlapping present-day events. Memory art has a separate time/evidence language.</text><text x="30" y="561" fill="#dbeafe" font-size="17">Replace with Character likenesses, legible circuit paths, physical receiver cues and localized handoff guidance.</text><text x="30" y="587" fill="#dbeafe" font-size="17">Do not invent transformation mechanics, hostile counts, solved boards, meters or measured room geometry.</text></g></svg>
