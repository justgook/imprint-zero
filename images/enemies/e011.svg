<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-label="E011 · Archive Sentry · hostile-state handoff"><title>E011 · Archive Sentry · hostile-state handoff</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="#a8b3c4"/></marker></defs><rect width="1200" height="650" fill="#151b25"/><g font-family="sans-serif" fill="#e7edf7"><text x="30" y="35" font-size="22">E011 · Archive Sentry · hostile-state handoff</text><rect x="30" y="85" width="360" height="375" rx="8" fill="#29333d" stroke="#b5bdcb"/><text x="42" y="112" font-size="18">STATE 1</text><text x="42" y="136" font-size="13">Observation / shutters</text><rect x="133" y="265" width="160" height="105" rx="14" fill="#747d70" stroke="#c2c4ae" stroke-width="3"/><rect x="165" y="209" width="98" height="65" rx="9" fill="#29383c" stroke="#c1c4b0" stroke-width="3"/><circle cx="213" cy="241" r="22" fill="#c3a765"/><rect x="140" y="365" width="145" height="23" fill="#303a42"/><path d="M170 212 V273 M257 212 V273" stroke="#9aa18b" stroke-width="14"/><path d="M268 241 H368" stroke="#b8b592" stroke-width="2" stroke-dasharray="8 6"/><rect x="420" y="85" width="360" height="375" rx="8" fill="#29333d" stroke="#b5bdcb"/><text x="432" y="112" font-size="18">STATE 2</text><text x="432" y="136" font-size="13">Locked horizontal burst</text><rect x="523" y="265" width="160" height="105" rx="14" fill="#747d70" stroke="#c2c4ae" stroke-width="3"/><rect x="555" y="209" width="98" height="65" rx="9" fill="#29383c" stroke="#c1c4b0" stroke-width="3"/><circle cx="603" cy="241" r="22" fill="#c3a765"/><rect x="530" y="365" width="145" height="23" fill="#303a42"/><path d="M560 212 V273 M647 212 V273" stroke="#9aa18b" stroke-width="14"/><path d="M655 241 H758" stroke="#e3b07b" stroke-width="7"/><rect x="810" y="85" width="360" height="375" rx="8" fill="#29333d" stroke="#b5bdcb"/><text x="822" y="112" font-size="18">STATE 3</text><text x="822" y="136" font-size="13">Open frontal recovery</text><rect x="913" y="265" width="160" height="105" rx="14" fill="#747d70" stroke="#c2c4ae" stroke-width="3"/><rect x="945" y="209" width="98" height="65" rx="9" fill="#29383c" stroke="#c1c4b0" stroke-width="3"/><circle cx="993" cy="241" r="22" fill="#92bba2"/><rect x="920" y="365" width="145" height="23" fill="#303a42"/><text x="30" y="505" font-size="17">Grounded body · all-kit reachable front · no rear-only lock · local indexing only</text><text x="30" y="540" font-size="16">A cable may connect one explicit pair; disabling indicators is not deletion of stored records.</text><text x="30" y="575" font-size="16">No allocated Profile, loot track, Controlled Unit or Integration output.</text><text x="30" y="624" font-size="14" fill="#a8b3c4">Replace with silhouette/state sheet; validate scale, shutter protection, shot commitment and punishable recovery.</text></g></svg>
